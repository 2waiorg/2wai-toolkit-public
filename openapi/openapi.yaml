  /v1/sessions/{sid}/audio:
    post:
      summary: Push Audio
      operationId: push_audio_v1_sessions__sid__audio_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      - name: more
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: More
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
